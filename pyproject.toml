[project]
name = "qa-chatbot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Tisha7353", email = "tgtishagarg@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "ipykernel>=7.4.0",
    "langchain>=1.4.3",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.6",
    "langchain-ollama>=1.1.0",
    "python-dotenv>=1.2.4",
    "streamlit>=1.65.0",
]

[project.scripts]
qa-chatbot = "qa_chatbot:main"

[build-system]
requires = ["uv_build>=0.12.20,<0.13.0"]
build-backend = "uv_build"
